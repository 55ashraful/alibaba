<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — My Daraz</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="splash-screen"><div class="splash-logo"><span>My Daraz</span></div></div>

    <div class="app-shell">
        <div id="app-header"></div>
        <div id="side-menu-host"></div>

        <div class="page-header">
            <h1>Checkout</h1>
            <p>Complete your order</p>
        </div>

        <main class="app-main">
            <div class="container">
                <div id="checkout-host"></div>
            </div>
        </main>

        <footer id="app-footer"></footer>
    </div>

    <!-- Address Modal -->
    <div class="modal" id="addressModal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>Add Address</h2>
                <span class="modal-close" onclick="closeModal('addressModal')">×</span>
            </div>
            <div class="admin-form-row">
                <div><label class="label">Name</label><input class="input" id="addrModalName"></div>
                <div><label class="label">Phone</label><input class="input" id="addrModalPhone"></div>
            </div>
            <div><label class="label">Address</label><textarea class="textarea" id="addrModalText" rows="3"></textarea></div>
            <div><label class="label">Label</label>
                <select class="select" id="addrModalLabel">
                    <option>Home</option><option>Office</option><option>Other</option>
                </select>
            </div>
            <div class="mt-3" style="display:flex;gap:var(--sp-2);">
                <button class="btn" id="addrModalSaveBtn" onclick="saveAddressFromModal()">Save</button>
                <button class="btn btn-ghost" onclick="closeModal('addressModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="chat-widget-host"></div>

    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/checkout.js"></script>
    <script src="../js/live-chat.js"></script>
    <script src="../js/common.js"></script>
    <script>
        bootstrapPage().then(() => initCheckoutPage());
    </script>
</body>
</html>
