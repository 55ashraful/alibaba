<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — My Daraz</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/account.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="splash-screen"><div class="splash-logo"><span>My Daraz</span></div></div>

    <div class="app-shell">
        <div id="app-header"></div>
        <div id="side-menu-host"></div>

        <main class="app-main">
            <div class="container">
                <div id="product-detail-host"></div>
            </div>
        </main>

        <footer id="app-footer"></footer>
    </div>

    <!-- Review modal -->
    <div class="modal" id="reviewModal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>রিভিউ লিখুন</h2>
                <span class="modal-close" onclick="closeModal('reviewModal')">×</span>
            </div>
            <p class="label">রেটিং দিন</p>
            <div class="stars-input">
                <span onclick="setReviewRating(1)">★</span>
                <span onclick="setReviewRating(2)">★</span>
                <span onclick="setReviewRating(3)">★</span>
                <span onclick="setReviewRating(4)">★</span>
                <span class="active" onclick="setReviewRating(5)">★</span>
            </div>
            <p class="label mt-3">আপনার মতামত</p>
            <textarea class="textarea" id="reviewComment" rows="4" placeholder="পণ্যের সম্পর্কে আপনার অভিজ্ঞতা লিখুন..."></textarea>
            <button class="btn mt-3" onclick="submitReviewForm()">সাবমিট করুন</button>
        </div>
    </div>

    <div id="chat-widget-host"></div>

    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/product.js"></script>
    <script src="../js/live-chat.js"></script>
    <script src="../js/common.js"></script>
    <script>
        bootstrapPage().then(() => initProductPage());
    </script>
</body>
</html>
