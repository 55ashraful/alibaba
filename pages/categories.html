<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Categories — My Daraz</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="splash-screen"><div class="splash-logo"><span>My Daraz</span></div></div>

    <div class="app-shell">
        <div id="app-header"></div>
        <div id="side-menu-host"></div>

        <div class="page-header">
            <h1>All Categories</h1>
            <p>Browse all product categories</p>
        </div>

        <main class="app-main">
            <div class="container">
                <div class="section">
                    <div class="categories-grid" id="all-categories-grid"></div>
                </div>
            </div>
        </main>

        <footer id="app-footer"></footer>
    </div>

    <div id="chat-widget-host"></div>

    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/live-chat.js"></script>
    <script src="../js/common.js"></script>
    <script>
        bootstrapPage().then(async () => {
            if (!AppState.allCategories.length) AppState.allCategories = await fetchCategories();
            const grid = document.getElementById('all-categories-grid');
            grid.innerHTML = AppState.allCategories.map(c => {
                const cname = AppState.language === 'en' && c.name_en ? c.name_en : c.name;
                return `<div class="category-card" onclick="location.href='category.html?id=${encodeURIComponent(c.id || c.name)}'"><img src="${c.imageUrl}" alt="${cname}"><span>${cname}</span></div>`;
            }).join('');
            hideSplash();
        });
    </script>
</body>
</html>
